name: CI

on:
  push:
    branches: [oddharak]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format
        run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-groups
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Tests (calibration package + PRH metric parity with platonic-rep)
        working-directory: Aristotelian
        run: >
          uv run pytest -q --no-cov
          tests/calibrated_similarity
          tests/aristotelian/metrics/test_prh_metrics.py
          tests/aristotelian/metrics/test_nulls.py
          tests/aristotelian/prh
