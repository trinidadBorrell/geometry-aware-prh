[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-cca"
version = "0.1.0"
description = "Ridge metrics, correlation-weighted CCA, centred CKA, and steering transport."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
models = ["torch"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rho_cca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_library_*.py"]
pythonpath = ["src"]
addopts = "-q"
