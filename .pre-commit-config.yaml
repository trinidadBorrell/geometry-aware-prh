# Ruff is configured in pyproject.toml to skip the upstream Aristotelian/ and platonic-rep/ code.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(Aristotelian|platonic-rep)/
      - id: trailing-whitespace
        exclude: ^(Aristotelian|platonic-rep)/
